name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Configure uv
        run: echo "UV_LINK_MODE=copy" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check file sizes
        run: uv run --extra dev python scripts/check_file_sizes.py

      - name: Ruff lint
        run: uv run --extra dev ruff check src tests scripts

      - name: Ruff format
        run: uv run --extra dev ruff format --check src tests scripts

      - name: Mypy
        run: uv run --extra dev mypy src

      - name: Vulture
        run: uv run --extra dev vulture

      - name: Deptry
        run: uv run --extra dev deptry .

      - name: Bandit
        run: uv run --extra dev bandit -q -r src scripts

      - name: Pytest
        run: timeout --foreground 420 uv run --extra dev pytest -q -n 0
