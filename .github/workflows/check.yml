name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Configure uv
        run: echo "UV_LINK_MODE=copy" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run checks
        shell: bash
        run: |
          set -euxo pipefail
          uv run --extra dev python scripts/check_file_sizes.py
          uv run --extra dev ruff check src tests scripts
          uv run --extra dev ruff format --check src tests scripts
          uv run --extra dev mypy src
          uv run --extra dev vulture
          uv run --extra dev deptry .
          uv run --extra dev bandit -q -r src scripts
          timeout --foreground 420 uv run --extra dev pytest -q -n 0
